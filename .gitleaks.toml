# Gitleaks configuration. Extends the default ruleset.
# The allowlist covers ONLY intentional, clearly fake canary values used by privacy tests to
# prove that secrets and addresses never reach logs, errors, fixtures, or client bundles.
title = "isp-search"

[extend]
useDefault = true

[allowlist]
description = "Intentional test canaries and ignored build output"
regexTarget = "line"
regexes = [
  '''CANARY[-_][A-Za-z0-9_-]+''',
  '''test-secret-that-is-at-least-32-characters-long''',
  '''another-secret-that-is-at-least-32-characters-long''',
  '''AKIAABCDEFGHIJKLMNOP''',
  '''eyJhbGciOiJIUzI1NiJ9\.eyJjYW5hcnkiOnRydWV9\.CANARYSIGNATURE''',
  # Domain identifiers in synthetic fixtures/tests, not credentials: offer and plan slugs.
  '''"(offerKey|planKey)":\s*"[a-z0-9-]+"''',
]
paths = [
  '''(^|/)\.env$''',
  '''(^|/)\.next/''',
  '''(^|/)dist/''',
  '''(^|/)node_modules/''',
  '''pnpm-lock\.yaml$''',
]
