packages:
  - "apps/*"
  - "packages/*"
  - "tooling"

# Reproducibility and supply-chain settings (pnpm 11 reads settings from this file, not .npmrc).
engineStrict: true
strictPeerDependencies: false
# Lifecycle scripts are blocked by default (strictDepBuilds). Only packages listed here may run build scripts.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  sharp: true

# Single source of truth for shared dependency versions.
catalog:
  typescript: 7.0.2
  "@types/node": 26.6.1
  zod: 4.6.5
  vitest: 5.0.1
  eslint: 10.10.0
  "@eslint/js": 10.0.1
  typescript-eslint: 8.70.0
  eslint-plugin-import-x: 4.17.1
  eslint-config-prettier: 10.1.8
  "@next/eslint-plugin-next": 16.3.5
  eslint-plugin-react-hooks: 7.1.1
  globals: 17.12.0
  prettier: 3.9.8
  turbo: 2.10.13
  next: 16.3.5
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  pg: 8.23.0
  "@types/pg": 8.23.1
  pg-boss: 12.33.1
  pino: 10.3.1
  tsx: 4.23.13
