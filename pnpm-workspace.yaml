packages:
  - "apps/*"
  - "packages/*"
  - "tooling"

# Reproducibility and supply-chain settings (pnpm 11 reads settings from this file, not .npmrc).
engineStrict: true
strictPeerDependencies: false
# Lifecycle scripts are blocked by default (strictDepBuilds). Only packages listed here may run build scripts.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  sharp: true

# Single source of truth for shared dependency versions.
catalog:
  typescript: 7.0.2
  "@types/node": 26.6.5
  zod: 4.6.5
  vitest: 5.0.3
  eslint: 10.12.0
  "@eslint/js": 10.0.1
  typescript-eslint: 8.71.1
  eslint-plugin-import-x: 4.17.1
  eslint-config-prettier: 10.1.8
  "@next/eslint-plugin-next": 16.4.0
  eslint-plugin-react-hooks: 7.1.1
  globals: 17.13.0
  prettier: 3.9.10
  turbo: 2.11.7
  next: 16.4.0
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  pg: 8.23.1
  "@types/pg": 8.23.1
  pg-boss: 12.37.1
  pino: 10.4.0
  tsx: 4.23.15
